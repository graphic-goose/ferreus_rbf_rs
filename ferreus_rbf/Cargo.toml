[package]
name = "ferreus_rbf"
version = "0.3.0"
edition = "2024"
authors = ["Daniel Owen <daniel.owen@live.com.au>"]
description = "Fast, memory efficient radial basis function (RBF) interpolation library"
readme = "README.md"
repository = "https://github.com/graphic-goose/ferreus_rbf_rs"
license = "MIT"
keywords = ["rbf", "radial-basis", "isosurface", "interpolation"]
rust-version = "1.97.1"

[lib]
crate-type = ["lib"]

[dependencies]
csv = "1.4.0"
rayon.workspace = true
faer.workspace = true
faer-traits = "0.24.0"
rand = "0.9.2"
roots = "0.0.8"
ferreus_rbf_utils = {path = "../ferreus_rbf_utils", version = "0.3.0"}
ferreus_bbfmm = {path = "../ferreus_bbfmm", version = "0.3.0"}
ferreus_rmt = {path = "../ferreus_rmt", version ="0.1.1"}
rstar = "0.12.2"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive", "rc"] }

[profile.dev]
opt-level = 3

[profile.dev.package.faer]
opt-level = 3

[package.metadata.docs.rs]
rustdoc-args = [
    "--html-in-header", "katex-header.html",
    "--html-after-content", "footer.html",
]
